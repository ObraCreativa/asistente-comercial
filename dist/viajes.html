<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viajes · Obra Creativa</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242424;background:#f7f7f5}body{margin:0}.wrap{max-width:680px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:16px 0 5px}small,.muted{color:#777}.day{display:grid;grid-template-columns:70px 1fr;gap:15px;padding:19px 0;border-top:1px solid #ddd}.date{font-weight:700;font-size:24px}.date small{display:block;font-size:12px;font-weight:500}.event{border:1px solid #ddd;border-left:4px solid #b7a58d;border-radius:12px;padding:14px;background:white;margin:8px 0}.event.flight{border-left-color:#427a9b}.event.hotel{border-left-color:#678a6b}.event.meeting{border-left-color:#ae8247}.event b{display:block;margin:5px 0}.event span{font-size:12px;color:#666}.empty{padding:18px 0;color:#999;font-size:14px}button{background:#292929;color:white;border:0;border-radius:10px;padding:11px 15px;cursor:pointer}button.secondary{background:white;color:#333;border:1px solid #ccc}dialog{border:0;border-radius:15px;max-width:420px;width:85%;box-shadow:0 12px 60px #0003}label{display:block;margin:10px 0;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #bbb;border-radius:8px;font:inherit}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}nav{display:flex;gap:8px;margin:18px 0}.note{font-size:12px;color:#777;margin-top:24px}</style></head><body><div class="wrap"><header><strong>OBRA CREATIVA</strong><span class="muted">Asistente comercial</span></header><h1>Viajes</h1><p class="muted">Agenda continua · vuelos, hoteles y citas comerciales</p><nav><button class="secondary" id="prev">← Semana anterior</button><button class="secondary" id="next">Semana siguiente →</button></nav><div id="days"></div><p class="note">Prototipo funcional local. Las citas se guardan únicamente en este navegador. TripIt, Flighty y Zoho CRM aún no están conectados; no se muestran datos reales ni alertas de vuelo.</p></div><dialog id="dlg"><form id="form"><h2>Nueva cita comercial</h2><label>Fecha<input id="date" type="date" required></label><label>Hora<input id="time" type="time" required></label><label>Cliente<input id="client" required placeholder="Nombre del cliente"></label><label>Descripción<textarea id="desc" placeholder="Motivo o notas"></textarea></label><div class="top"><button type="button" class="secondary" id="cancel">Cancelar</button><button>Guardar cita</button></div></form></dialog><script>(()=>{const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),fmt=d=>new Intl.DateTimeFormat('es-MX',{weekday:'long',month:'long',day:'numeric'}).format(d);let start=new Date();start.setHours(12,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));let events=[];try{events=JSON.parse(localStorage.getItem('oc-viajes-citas')||'[]')}catch{}const days=document.getElementById('days'),dlg=document.getElementById('dlg');function render(){days.innerHTML='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),day=document.createElement('section');day.className='day';const left=document.createElement('div');left.className='date';left.textContent=pad(d.getDate());const mon=document.createElement('small');mon.textContent=new Intl.DateTimeFormat('es-MX',{month:'short'}).format(d);left.append(mon);const right=document.createElement('div'),top=document.createElement('div');top.className='top';const heading=document.createElement('strong');heading.textContent=fmt(d);const add=document.createElement('button');add.className='secondary';add.textContent='+ Cita';add.onclick=()=>{document.getElementById('date').value=key;dlg.showModal()};top.append(heading,add);right.append(top);let found=events.filter(e=>e.date===key).sort((a,b)=>a.time.localeCompare(b.time));if(!found.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Sin actividades';right.append(empty)}found.forEach(e=>{let card=document.createElement('article');card.className='event meeting';let t=document.createElement('span');t.textContent=e.time+' · Cita comercial';let b=document.createElement('b');b.textContent=e.client;let p=document.createElement('div');p.textContent=e.desc||'';let del=document.createElement('button');del.className='secondary';del.textContent='Eliminar';del.onclick=()=>{events=events.filter(x=>x.id!==e.id);save()};card.append(t,b,p,del);right.append(card)});day.append(left,right);days.append(day)}}function save(){try{localStorage.setItem('oc-viajes-citas',JSON.stringify(events))}catch{}render()}document.getElementById('prev').onclick=()=>{start.setDate(start.getDate()-7);render()};document.getElementById('next').onclick=()=>{start.setDate(start.getDate()+7);render()};document.getElementById('cancel').onclick=()=>dlg.close();document.getElementById('form').onsubmit=e=>{e.preventDefault();events.push({id:Date.now()+Math.random(),date:document.getElementById('date').value,time:document.getElementById('time').value,client:document.getElementById('client').value.trim(),desc:document.getElementById('desc').value.trim()});save();e.target.reset();dlg.close()};render()})();</script></body></html>
